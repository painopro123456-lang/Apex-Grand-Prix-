name: Windows EXE build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    name: Export Windows x64 game
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Windows export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Import project resources
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:" /tmp/godot-import.log; then
            echo "Godot import reported errors."
            exit 1
          fi

      - name: Export Windows EXE
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" "build/Apex-Grand-Prix.exe" 2>&1 | tee /tmp/godot-export.log
          test -s "build/Apex-Grand-Prix.exe"
          size=$(stat -c%s "build/Apex-Grand-Prix.exe")
          echo "Windows executable size: $size bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "Exported EXE is unexpectedly small."
            exit 1
          fi

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Grand-Prix-Windows-x64-EXE
          path: build/Apex-Grand-Prix.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct EXE download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apex-build-${{ github.run_number }}
          name: Apex Grand Prix Windows Build ${{ github.run_number }}
          body: |
            Automated Windows x64 export of the current Apex Grand Prix prototype.
            This is a development build, not a finished or production-certified release.
          prerelease: true
          files: build/Apex-Grand-Prix.exe
          fail_on_unmatched_files: true
