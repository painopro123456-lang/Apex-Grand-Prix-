name: Godot validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-validation:
    name: Import, parse and startup smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project and validate scripts/resources
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:" /tmp/godot-import.log; then
            echo "Godot import reported script or resource errors."
            exit 1
          fi

      - name: Install software-rendering test display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers

      - name: Launch main scene for smoke test
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json godot --audio-driver Dummy --path . --quit-after 300 2>&1 | tee /tmp/godot-startup.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:" /tmp/godot-startup.log; then
            echo "Godot startup reported script or runtime errors."
            exit 1
          fi

      - name: Test barrier crashes, damage and retirement
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --path . --script res://tests/crash_collision_smoke.gd 2>&1 | tee /tmp/godot-crash.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:" /tmp/godot-crash.log; then
            echo "Crash collision test reported script or runtime errors."
            exit 1
          fi
          grep -q "CRASH SMOKE PASS" /tmp/godot-crash.log

      - name: Test race start and player acceleration
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --path . --script res://tests/gameplay_smoke.gd 2>&1 | tee /tmp/godot-gameplay.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:" /tmp/godot-gameplay.log; then
            echo "Gameplay smoke test reported script or runtime errors."
            exit 1
          fi
          grep -q "GAMEPLAY SMOKE PASS" /tmp/godot-gameplay.log
