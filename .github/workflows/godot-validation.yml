name: Godot validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-validation:
    name: Import, parse and startup smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Runtime parse and startup validation
        shell: bash
        run: |
          set -o pipefail
          # The Godot 4.3 editor importer intermittently aborts on hosted Linux
          # runners. Load the actual project at runtime instead of invoking editor mode.
          timeout 60s godot --headless --path . --quit-after 3 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:" /tmp/godot-import.log; then
            echo "Godot runtime reported script or resource errors."
            exit 1
          fi

      - name: Install software-rendering test display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Launch main scene for smoke test
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --path . --quit-after 90 2>&1 | tee /tmp/godot-startup.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:" /tmp/godot-startup.log; then
            echo "Godot startup reported script or runtime errors."
            exit 1
          fi

      - name: Test barrier crashes, damage and retirement
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --path . --script res://tests/crash_collision_smoke.gd 2>&1 | tee /tmp/godot-crash.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:" /tmp/godot-crash.log; then
            echo "Crash collision test reported script or runtime errors."
            exit 1
          fi
          grep -q "CRASH SMOKE PASS" /tmp/godot-crash.log

      - name: Test race start and player acceleration
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --path . --script res://tests/gameplay_smoke.gd 2>&1 | tee /tmp/godot-gameplay.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:" /tmp/godot-gameplay.log; then
            echo "Gameplay smoke test reported script or runtime errors."
            exit 1
          fi
          grep -q "GAMEPLAY SMOKE PASS" /tmp/godot-gameplay.log

      - name: Capture real gameplay screenshot
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --path . --script res://tests/capture_gameplay.gd 2>&1 | tee /tmp/godot-screenshot.log
          test -s /tmp/apex-gameplay.png
          grep -q "GAMEPLAY SCREENSHOT SAVED" /tmp/godot-screenshot.log

      - name: Upload gameplay screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Grand-Prix-Gameplay-Screenshot
          path: /tmp/apex-gameplay.png
          if-no-files-found: error
          retention-days: 14
